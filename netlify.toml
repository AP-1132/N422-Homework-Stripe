[build]
base = "server"
command = "npx prisma generate && npm ci --prefix ../client && npm run build --prefix ../client"
publish = "../client/dist"

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["@prisma/client"]
included_files = ["node_modules/.prisma/client/**"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
